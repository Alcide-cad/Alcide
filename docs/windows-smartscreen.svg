<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">Windows SmartScreen - diagram</title>
  <desc id="desc">Diagram, not a screenshot. When Windows shows Windows a prot&#233;g&#233; votre ordinateur, choose Informations compl&#233;mentaires / More info, then Ex&#233;cuter quand m&#234;me / Run anyway.</desc>
  <rect width="720" height="280" rx="12" fill="#f4f6f8"/>
  <text x="24" y="32" font-family="Segoe UI, sans-serif" font-size="13" fill="#5c6b7a">Diagramme / Diagram - not a screenshot</text>
  <rect x="24" y="48" width="300" height="200" rx="8" fill="#ffffff" stroke="#c5ced6"/>
  <rect x="24" y="48" width="300" height="36" rx="8" fill="#1b3a4b"/>
  <rect x="24" y="68" width="300" height="16" fill="#1b3a4b"/>
  <text x="40" y="72" font-family="Segoe UI, sans-serif" font-size="13" fill="#ffffff">Windows SmartScreen</text>
  <path d="M48 108 h22 l8 6 v22 h-38 v-22 l8-6 z" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="86" y="118" font-family="Segoe UI, sans-serif" font-size="13" fill="#1a1a1a">Windows a prot&#233;g&#233; votre ordinateur</text>
  <text x="86" y="136" font-family="Segoe UI, sans-serif" font-size="11" fill="#5c6b7a">Windows protected your PC</text>
  <rect x="40" y="160" width="268" height="28" rx="4" fill="#e8f1fb" stroke="#2b6cb0"/>
  <text x="52" y="179" font-family="Segoe UI, sans-serif" font-size="13" fill="#1a365d">1  Informations compl&#233;mentaires</text>
  <rect x="40" y="198" width="268" height="28" rx="4" fill="#e7f6ee" stroke="#1f7a4d"/>
  <text x="52" y="217" font-family="Segoe UI, sans-serif" font-size="13" fill="#14532d">2  Ex&#233;cuter quand m&#234;me</text>
  <path d="M340 148 h36" stroke="#8aa0b2" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#8aa0b2"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, sans-serif" font-size="15" fill="#1a1a1a">
    <circle cx="412" cy="92" r="14" fill="#2b6cb0"/>
    <text x="412" y="97" text-anchor="middle" fill="#ffffff" font-size="14">1</text>
    <text x="436" y="90">Informations compl&#233;mentaires</text>
    <text x="436" y="110" fill="#5c6b7a" font-size="13">More info</text>
    <circle cx="412" cy="168" r="14" fill="#1f7a4d"/>
    <text x="412" y="173" text-anchor="middle" fill="#ffffff" font-size="14">2</text>
    <text x="436" y="166">Ex&#233;cuter quand m&#234;me</text>
    <text x="436" y="186" fill="#5c6b7a" font-size="13">Run anyway</text>
  </g>
</svg>
